{% extends "base.html" %}{% block content %}<h1>Daily attendance · {{ school_class.name }}</h1><form method="get" class="inline-form"><label>Date</label><input type="date" name="day" value="{{ day.isoformat() }}"><button class="soft">Load date</button></form><section class="panel"><form method="post"><input type="hidden" name="day" value="{{ day.isoformat() }}"><div class="table-scroll"><table><tr><th>Roll</th><th>Student</th><th>Attendance</th></tr>{% for s in roster %}<tr><td>{{ s.roll_no or '—' }}</td><td>{{ s.name }}</td><td><select name="student_{{ s.id }}"><option value="Present" {% if existing.get(s.id)=='Present' %}selected{% endif %}>Present</option><option value="Absent" {% if existing.get(s.id)=='Absent' or not existing.get(s.id) %}selected{% endif %}>Absent</option><option value="Late" {% if existing.get(s.id)=='Late' %}selected{% endif %}>Late</option></select></td></tr>{% endfor %}</table></div><button>Save attendance</button></form></section>{% endblock %}
